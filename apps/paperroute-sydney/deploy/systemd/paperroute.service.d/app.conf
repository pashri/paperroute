[Service]
Environment="PAPERROUTE_APP_ARGS=--timetable /var/lib/paperroute/timetable.db --tiles /var/lib/paperroute/tiles.db --rebuild"
Environment=PAPERROUTE_KEY_FILE_TFNSW=/var/lib/paperroute/secrets
# Releases before units contract 1 read the key file from this name.
Environment=PAPERROUTE_API_KEY_FILE=/var/lib/paperroute/secrets
