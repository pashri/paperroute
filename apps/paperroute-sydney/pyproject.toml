[project]
name = "paperroute-sydney"
version = "0.1.0"
description = "Two-knob e-paper tracker for Sydney public transport"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "paperroute-device",
    "paperroute-transit",
    "aiohttp>=3.12",
    "multidict>=6.0",
]

[project.scripts]
paperroute-board = "paperroute_sydney.__main__:main"
paperroute-build = "paperroute_sydney.build.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperroute_sydney"]

[tool.uv.sources]
paperroute-device = { workspace = true }
paperroute-transit = { workspace = true }
