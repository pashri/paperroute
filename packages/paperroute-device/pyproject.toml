[project]
name = "paperroute-device"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "numpy>=2.3",
    "paperroute-hardware",
    "pydantic>=2",
    "python-json-logger>=3.2",
    "segno>=1.6.6",
    "skia-python>=138.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperroute_device"]

[tool.uv.sources]
paperroute-hardware = { workspace = true }
