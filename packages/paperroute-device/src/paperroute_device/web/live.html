<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>paperroute</title>
  <link rel="stylesheet" href="/live.css">
  <script type="module" src="/live.js"></script>
</head>
<body>
  <header>
    <h1>paperroute</h1>
  </header>
  {{nav}}
  <main>
    <div class="frame-box">
      <img id="frame" class="frame" src="/frame.png" width="800" height="480"
           alt="Device screen">
    </div>
    <section class="card knobs" aria-labelledby="knobs">
      <h2 id="knobs">Knobs</h2>
      <div class="knob" role="group" aria-labelledby="top-knob">
        <h3 id="top-knob">Top</h3>
        <button type="button" class="secondary" data-knob="top"
                data-action="left"
                aria-label="Top knob, turn left">&#x27F2; Left</button>
        <button type="button" data-knob="top" data-action="press"
                aria-label="Top knob, press"
                aria-describedby="hint">Press</button>
        <button type="button" class="secondary" data-knob="top"
                data-action="right"
                aria-label="Top knob, turn right">Right &#x27F3;</button>
      </div>
      <div class="knob" role="group" aria-labelledby="bottom-knob">
        <h3 id="bottom-knob">Bottom</h3>
        <button type="button" class="secondary" data-knob="bottom"
                data-action="left"
                aria-label="Bottom knob, turn left">&#x27F2; Left</button>
        <button type="button" data-knob="bottom" data-action="press"
                aria-label="Bottom knob, press"
                aria-describedby="hint">Press</button>
        <button type="button" class="secondary" data-knob="bottom"
                data-action="right"
                aria-label="Bottom knob, turn right">Right &#x27F3;</button>
      </div>
      <p id="hint" class="hint">
{{hint}}
      </p>
    </section>
  </main>
  <footer>
    <p id="status" aria-live="off">Status: -</p>
  </footer>
</body>
</html>
