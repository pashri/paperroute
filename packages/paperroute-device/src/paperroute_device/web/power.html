<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Confirm - paperroute</title>
  <link rel="stylesheet" href="/live.css">
  {{sheets}}
</head>
<body>
  <header>
    <h1>paperroute</h1>
  </header>
  {{nav}}
  <main>
    <section class="card setting" aria-labelledby="device">
      <h2 id="device">Device</h2>
      <form method="post" action="/power">
        <p>{{question}}</p>
        <input type="hidden" name="action" value="{{action}}">
        <div class="buttons">
          <a class="button secondary" href="/device">Cancel</a>
          <button type="submit"{{tone}}>{{confirm}}</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
