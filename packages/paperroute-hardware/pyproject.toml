[project]
name = "paperroute-hardware"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "gpiod==2.5.0; sys_platform == 'linux'",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperroute_hardware"]
