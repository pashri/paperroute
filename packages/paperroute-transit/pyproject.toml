[project]
name = "paperroute-transit"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "paperroute-device",
    "numpy>=2.3",
]

[project.optional-dependencies]
tiles = ["osmium>=4.3", "shapely>=2.2"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperroute_transit"]

[tool.uv.sources]
paperroute-device = { workspace = true }
