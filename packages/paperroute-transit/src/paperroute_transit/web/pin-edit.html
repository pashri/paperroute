<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}} - paperroute</title>
  <link rel="stylesheet" href="/vendor/tom-select.css">
  <link rel="stylesheet" href="/live.css">
  {{sheets}}
  <link rel="stylesheet" href="/board.css">
  <script type="module" src="/pins.js"></script>
  <script type="module" src="/windows.js"></script>
  <script src="/vendor/tom-select.complete.min.js" defer></script>
  <script type="module" src="/stop-search.js"></script>
  <script type="module" src="/ways.js"></script>
  {{scripts}}
</head>
<body>
  <header>
    <h1>paperroute</h1>
  </header>
  {{nav}}
  <main>
    <section class="card" aria-labelledby="pin-edit-heading">
      <h2 id="pin-edit-heading">{{title}}</h2>
      {{notice}}
      {{body}}
    </section>{{danger}}
    <dialog id="delete-dialog" aria-labelledby="delete-question">
      <form method="dialog">
        <p id="delete-question"></p>
        <div class="buttons">
          <button type="submit" value="cancel"
                  class="secondary">Cancel</button>
          <button type="submit" value="delete" class="danger">Delete</button>
        </div>
      </form>
    </dialog>
  </main>
</body>
</html>
