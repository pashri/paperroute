<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pins - paperroute</title>
  <link rel="stylesheet" href="/live.css">
  {{sheets}}
  <link rel="stylesheet" href="/board.css">
  <link rel="stylesheet" href="/route-colours.css">
  <script type="module" src="/pins.js"></script>
</head>
<body>
  <header>
    <h1>paperroute</h1>
  </header>
  {{nav}}
  <main>
    <section class="card" aria-labelledby="pins-heading">
      <h2 id="pins-heading">Your pins</h2>
      {{notice}}
      {{pins}}
      <form class="search" method="get" action="/pins/new" role="search">
        <label for="pin-search">Add a pin</label>
        <input id="pin-search" type="search" name="q"
               placeholder="Stop or station">
        <button type="submit">Search</button>
      </form>
      <form method="get" action="/pins/ways">
        <button type="submit" class="secondary">Add a connection</button>
      </form>
    </section>
    <form id="order-form" method="post" action="/pins/order" hidden>
      <input type="hidden" name="refs" value="">
    </form>
  </main>
</body>
</html>
