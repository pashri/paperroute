[project]
name = "paperroute"
version = "0.1.0"
description = "Two-knob e-paper tracker for Sydney public transport"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "gtfs-realtime-bindings>=1.0",
    "numpy>=2.3",
    "pydantic>=2.12",
    "python-json-logger>=3.2",
    "segno>=1.6.6",
    "skia-python>=138.0",
    "gpiod==2.5.0; sys_platform == 'linux'",
    "paperroute-hardware",
    "paperroute-device",
    "paperroute-transit",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperroute"]

[dependency-groups]
dev = [
    "fonttools>=4.55",
    "hypothesis>=6.0",
    "isort>=5.13",
    "mypy>=1.15",
    "numpydoc>=1.8",
    "paperroute-testkit",
    "pylint>=3.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]
tiles = ["osmium>=4.3", "shapely>=2.2"]

[tool.uv]
python-preference = "only-managed"
default-groups = ["dev", "tiles"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
paperroute-hardware = { workspace = true }
paperroute-device = { workspace = true }
paperroute-transit = { workspace = true }
paperroute-testkit = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers"
filterwarnings = ["error"]
norecursedirs = [".*", "dist", "*.egg", "venv", "node_modules"]

[tool.mypy]
strict = true
python_version = "3.14"
files = [
    "src",
    "tests",
    "packages/paperroute-hardware/src",
    "packages/paperroute-device/src",
    "packages/paperroute-transit/src",
    "packages/paperroute-testkit/src",
]

[[tool.mypy.overrides]]
module = ["skia", "google.transit.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gpiod", "gpiod.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 79
known_first_party = [
    "paperroute",
    "paperroute_hardware",
    "paperroute_device",
    "paperroute_transit",
    "paperroute_testkit",
    "tests",
]
src_paths = [
    "src",
    "tests",
    "packages/paperroute-hardware/src",
    "packages/paperroute-device/src",
    "packages/paperroute-transit/src",
    "packages/paperroute-testkit/src",
]
skip = [".venv"]

[tool.pylint.main]
py-version = "3.14"
extension-pkg-allow-list = ["skia", "osmium"]

[tool.pylint.imports]
known-first-party = [
    "paperroute",
    "paperroute_hardware",
    "paperroute_device",
    "paperroute_transit",
]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.typecheck]
generated-members = ["gtfs_realtime_pb2.*"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 3
max-attributes = 16

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01", "ES01"]
exclude = ['\.__init__$']

[tool.coverage.run]
source = [
    "paperroute",
    "paperroute_hardware",
    "paperroute_device",
    "paperroute_transit",
]
disable_warnings = ["module-not-imported", "no-data-collected"]
omit = [
    "src/paperroute/adapters/tk_monitor.py",
    "src/paperroute/__main__.py",
    "src/paperroute/build/__main__.py",
]
