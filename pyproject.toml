[dependency-groups]
dev = [
    "fonttools>=4.55",
    "hypothesis>=6.0",
    "isort>=5.13",
    "mypy>=1.15",
    "numpydoc>=1.8",
    "paperroute-sydney",
    "paperroute-testkit",
    "pylint>=3.3",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]
tiles = ["paperroute-transit[tiles]"]

[tool.uv]
python-preference = "only-managed"
default-groups = ["dev", "tiles"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
paperroute-hardware = { workspace = true }
paperroute-device = { workspace = true }
paperroute-transit = { workspace = true }
paperroute-testkit = { workspace = true }
paperroute-sydney = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--strict-markers"
filterwarnings = ["error"]
norecursedirs = [".*", "dist", "*.egg", "venv", "node_modules"]

[tool.mypy]
strict = true
python_version = "3.14"
files = [
    "conftest.py",
    "tests",
    "apps/paperroute-sydney/src",
    "packages/paperroute-hardware/src",
    "packages/paperroute-device/src",
    "packages/paperroute-transit/src",
    "packages/paperroute-testkit/src",
]

[[tool.mypy.overrides]]
module = ["skia", "google.transit.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gpiod", "gpiod.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shapely.*"]
ignore_missing_imports = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
line_length = 79
known_first_party = [
    "paperroute_sydney",
    "paperroute_hardware",
    "paperroute_device",
    "paperroute_transit",
    "paperroute_testkit",
    "tests",
]
src_paths = [
    "apps/paperroute-sydney/src",
    "tests",
    "packages/paperroute-hardware/src",
    "packages/paperroute-device/src",
    "packages/paperroute-transit/src",
    "packages/paperroute-testkit/src",
]
skip = [".venv"]

[tool.pylint.main]
py-version = "3.14"
extension-pkg-allow-list = ["skia", "osmium"]

[tool.pylint.imports]
known-first-party = [
    "paperroute_sydney",
    "paperroute_hardware",
    "paperroute_device",
    "paperroute_transit",
]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.typecheck]
generated-members = ["gtfs_realtime_pb2.*"]

[tool.pylint.design]
max-args = 8
max-positional-arguments = 3
max-attributes = 16

[tool.pylint."messages control"]
disable = ["too-few-public-methods"]

[tool.numpydoc_validation]
checks = ["all", "EX01", "SA01", "ES01"]
exclude = ['\.__init__$']

[tool.coverage.run]
source = [
    "paperroute_sydney",
    "paperroute_hardware",
    "paperroute_device",
    "paperroute_transit",
]
disable_warnings = ["module-not-imported", "no-data-collected"]
omit = [
    "packages/paperroute-transit/src/paperroute_transit/adapters/tk_monitor.py",
    "apps/paperroute-sydney/src/paperroute_sydney/__main__.py",
    "packages/paperroute-transit/src/paperroute_transit/board.py",
    "apps/paperroute-sydney/src/paperroute_sydney/build/__main__.py",
]
