<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings - paperroute</title>
  <link rel="stylesheet" href="/live.css">
  <script type="module" src="/settings.js"></script>
</head>
<body>
  <header>
    <h1>paperroute</h1>
    <nav aria-label="Pages">
      <ul class="pages">
        <li><a href="/">Live</a></li>
        <li><a href="/settings" aria-current="page">Settings</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="setting" aria-labelledby="timetable">
      <h2 id="timetable">Timetable</h2>
      <form id="timetable-form" method="post" action="/settings">
        <input type="hidden" name="auto_rebuild" value="off">
        <label class="switch">
          <input id="auto-rebuild" type="checkbox" role="switch"
                 name="auto_rebuild" value="on"
                 aria-describedby="auto-rebuild-hint"{{auto_rebuild}}>
          Rebuild timetable automatically
        </label>
        <p id="auto-rebuild-hint" class="hint">
          Rebuilds an outdated timetable on the device when a new version
          needs it.
        </p>
        <button id="timetable-save" type="submit">Save</button>
        <p id="settings-status" class="hint" aria-live="polite"></p>
      </form>
    </section>
    <section class="setting" aria-labelledby="device">
      <h2 id="device">Device</h2>
      <div class="buttons">
        <form method="post" action="/settings/power?action=reboot"
              data-power="reboot">
          <button type="submit">Restart</button>
        </form>
        <form method="post" action="/settings/power?action=poweroff"
              data-power="poweroff">
          <button type="submit">Shut down</button>
        </form>
      </div>
      <p id="device-status" class="hint" aria-live="polite">{{device_status}}</p>
      <dialog id="reboot-dialog" data-power="reboot"
              aria-labelledby="reboot-question">
        <form method="dialog">
          <p id="reboot-question">Restart now?</p>
          <div class="buttons">
            <button value="cancel" autofocus>Cancel</button>
            <button value="confirm">Restart</button>
          </div>
        </form>
      </dialog>
      <dialog id="poweroff-dialog" data-power="poweroff"
              aria-labelledby="poweroff-question">
        <form method="dialog">
          <p id="poweroff-question">Shut down now? The screen will say when it's safe to unplug.</p>
          <div class="buttons">
            <button value="cancel" autofocus>Cancel</button>
            <button value="confirm">Shut down</button>
          </div>
        </form>
      </dialog>
    </section>
  </main>
</body>
</html>
