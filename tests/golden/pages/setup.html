<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wi-Fi setup - paperroute</title>
  <link rel="stylesheet" href="/live.css">
  <script type="module" src="/setup.js"></script>
</head>
<body>
  <header>
    <h1>paperroute</h1>
  </header>
  <nav aria-label="Pages">
    <ul class="pages">
      <li>
        <a href="/">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="12" rx="1"/><path d="M8 21h8"/>
          </svg>
          <span>Live</span>
        </a>
      </li>
      <li>
        <a href="/pins">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M12 22s7-7 7-12a7 7 0 0 0-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>
          </svg>
          <span>Pins</span>
        </a>
      </li>
      <li>
        <a href="/settings">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
          </svg>
          <span>Settings</span>
        </a>
      </li>
      <li>
        <a href="/device">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24">
            <rect x="6" y="3" width="12" height="18" rx="2"/><path d="M10 18h4"/>
          </svg>
          <span>Device</span>
        </a>
      </li>
    </ul>
  </nav>
  <main>
    <section class="card setting setup" aria-labelledby="wifi-setup">
      <h2 id="wifi-setup">Wi-Fi setup</h2>
      
      <form method="post" action="/setup">
      <fieldset>
        <legend>Your Wi-Fi</legend>
        <label>
          <input type="radio" name="network" value="Home" required>
          Home (strong)
        </label>
        <label>
          <input type="radio" name="network" value="Cafe:Wi-Fi" required>
          Cafe:Wi-Fi (good) (open)
        </label>
        <label>
          <input type="radio" name="network" value="Corp" required disabled>
          Corp (weak) (not supported)
        </label>
        <label>
          <input type="radio" name="network" value="__hidden__" required>
          Hidden network
        </label>
        <label for="hidden-ssid">Hidden network name</label>
        <input id="hidden-ssid" name="hidden_ssid" type="text"
               autocomplete="off" autocapitalize="off" spellcheck="false">
      </fieldset>
      <label for="password">Password</label>
      <div class="password">
        <input id="password" name="password" type="password"
               autocomplete="current-password">
        <button id="show-password" type="button" class="secondary"
                aria-controls="password"
                aria-pressed="false" hidden>Show password</button>
      </div>
      <label for="api-key">TfNSW API key</label>
      <input id="api-key" name="api_key" type="text" autocomplete="off"
             autocapitalize="off" spellcheck="false">
      <button type="submit">Join</button>
    </form>
    </section>
  </main>
</body>
</html>
